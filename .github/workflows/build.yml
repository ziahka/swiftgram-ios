name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Show environment
        run: |
          xcodebuild -version || true
          ls /Applications | grep -i Xcode || true
          df -h /

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Inject API credentials
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python3 - <<'PY'
          import json, os
          p = "build-system/appstore-configuration.json"
          d = json.load(open(p))
          d["api_id"] = os.environ["API_ID"]
          d["api_hash"] = os.environ["API_HASH"]
          json.dump(d, open(p, "w"), indent="\t")
          print("api_id set:", bool(d["api_id"]), "| api_hash set:", bool(d["api_hash"]))
          PY

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-bin/Telegram/*.ipa; do
            cp "$f" "$OUTPUT_PATH/App.ipa"
          done
          ls -la "$OUTPUT_PATH"

          # collect dsym
          mkdir -p build/DSYMs
          find bazel-bin -maxdepth 4 -name '*.dSYM' -exec cp -R {} build/DSYMs/ \; 2>/dev/null || true
          (cd build && zip -qr "../$OUTPUT_PATH/Telegram.DSYMs.zip" DSYMs) || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/App.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload DSYMs artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-DSYMs
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: SwiftGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Unsigned IPA build of SwiftGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          files: |
            /Users/Shared/telegram-ios/build/artifacts/App.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
